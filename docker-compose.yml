services:
  superkaraoke:
    build: .
    # Or pull a pre-built image:
    # image: ghcr.io/jgruber/superkaraoke:latest
    ports:
      - "8080:8080"
    volumes:
      # Bind-mount your karaoke media directory (read-only)
      - /path/to/your/karaoke:/media/karaoke:ro
      # Named volume for the SQLite database (persists between container restarts)
      - superkaraoke_data:/data
    environment:
      SK_MEDIA_DIR: /media/karaoke
      SK_DB_PATH: /data/superkaraoke.db
      # Tell the bgutil-ytdlp-pot-provider plugin where its PO token
      # generator lives (the bgutil-pot sidecar below).
      GETPOT_BGUTIL_BASE_URL: http://bgutil-pot:4416
      # Settings → Updates uses Portainer to self-restart (after a yt-dlp
      # pip upgrade) and to redeploy the sidecar (for PO-token updates).
      # Set PORTAINER_TOKEN in your deploy env or Portainer stack env.
      # If any of these are unset, the Update buttons stay available but
      # the PO-token one is disabled and the self-restart falls back to
      # "update installed; restart the container yourself."
      SK_PORTAINER_URL:         ${PORTAINER_URL:-}
      SK_PORTAINER_TOKEN:       ${PORTAINER_TOKEN:-}
      SK_PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-}
      SK_PORTAINER_STACK_ID:    ${PORTAINER_STACK_ID:-}
    restart: unless-stopped
    depends_on:
      - bgutil-pot
    # Optional: limit CPU to prevent ffmpeg from starving other containers
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"

  # YouTube Proof-of-Origin (PO) token generator. yt-dlp needs this to
  # fetch streams on most player clients; the plugin inside the
  # superkaraoke container calls out to this sidecar via HTTP.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

volumes:
  # Docker-managed volume for the library database
  superkaraoke_data:
